<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awakening Support Simulator</title>
    <link rel="stylesheet" href="./support.css">
</head>
<body>
    <div class="panel">
        <h1>Child Simulator</h1>
        <p>Want to S-support someone? View what child you'd get, and their abilities.</p>
    </div>

    <div class="home">
        <a href="home.html">Home</a>
        <a href="characters.html">Characters</a>
        <a href="Support.html" class="selected">Supports</a>
        <a href="map.html">World Map</a>
    </div>

        <div class="controls">
            <label>
                Mother
                <select id="motherSelect"></select>
            </label>

            <label>
                Father
                <select id="fatherSelect"></select>
            </label>
        </div>

        <button id="generateBtn">Generate Child</button>

        <div id="result" class="result">
            <h2>Child</h2>
            <p>Choose a mother and father to see the result.</p>
        </div>

        <div class="family-legend" id="familyLegend">
            <h2>Valid Pairings</h2>
            <table>
                <thead>
                    <tr>
                        <th>Father</th>
                        <th>Mother</th>
                        <th>Child</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="../backend/childSystem.js" defer></script>
</body>
</html>
