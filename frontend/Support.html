<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awakening Support Simulator</title>
    <link rel="stylesheet" href="./support.css">
</head>
<body>
    <div class="panel">
        <h1>Fire Emblem Awakening Pairing</h1>

        <div class="controls">
            <label>
                Mother
                <select id="motherSelect"></select>
            </label>

            <label>
                Father
                <select id="fatherSelect"></select>
            </label>
        </div>

        <button id="generateBtn">Generate Child</button>

        <div id="result" class="result">
            <h2>Child</h2>
            <p>Choose a mother and father to see the result.</p>
        </div>

        <div class="family-legend" id="familyLegend">
            <h2>Known Pairings</h2>
            <table>
                <thead>
                    <tr>
                        <th>Child</th>
                        <th>Mother</th>
                        <th>Father</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="../backend/childSystem.js" defer></script>
</body>
</html>
