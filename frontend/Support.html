<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awakening Support Simulator</title>
    <link rel="stylesheet" href="./support.css">
</head>
<body>
    <div class="panel">
        <h1>Fire Emblem Awakening Pairing</h1>

        <div class="controls">
            <label>
                Mother
                <select id="motherSelect"></select>
            </label>

            <label>
                Father
                <select id="fatherSelect"></select>
            </label>

            <label>
                Support Rank
                <select id="supportRank">
                    <option value="C">C</option>
                    <option value="B">B</option>
                    <option value="A">A</option>
                    <option value="S">S</option>
                </select>
            </label>
        </div>

        <button id="generateBtn">Generate Child</button>

        <div id="result" class="result">
            <h2>Child</h2>
            <p>Choose a mother and father to see the result.</p>
        </div>
    </div>

    <script src="../backend/childSystem.js" defer></script>
</body>
</html>
