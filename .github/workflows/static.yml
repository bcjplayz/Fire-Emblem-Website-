# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # This creates an environment that tricks the browser into finding your absolute paths!
      - name: Stage files for deployment
        run: |
          mkdir _site
          
          # 1. Copies your index.html, README, etc. directly into the website root folder
          cp index.html _site/ 2>/dev/null || true
          
          # 2. Re-creates your absolute "/root" folder exactly inside the website folder
          mkdir -p _site/root
          cp -r root/* _site/root/
          
          # 3. Dynamic absolute routing fix for HTML documents
          # This injects a base path so the browser maps absolute "/root/" paths to the site subfolder
          find _site -type f -name "*.html" -exec sed -i 's|<head>|<head><base href="/'${{ github.event.repository.name }}'/ ">|g' {} +

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Points to the newly staged folder containing all assets
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
